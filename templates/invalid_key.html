<!-- templates/invalid_key.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invalid Key</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: Arial, sans-serif;
            color: #cc0000;
        }
        .message {
            text-align: center;
        }
        .input-container {
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            width: 200px;
            border: 1px solid #cc0000;
            border-radius: 4px;
        }
        button {
            padding: 8px 12px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
            background-color: #cc0000;
            color: #fff;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #a30000;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Invalid Key</h1>
        <p>DM on Twitter/X for a key. By James (@jchencxh) & Cem (@cemm3r)</p>
        <div class="input-container">
            <form action="/" method="get">
                <input type="text" name="key" placeholder="Enter your key" required>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
